.vision-tools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 5px}
.vision-result{margin-top:9px;border:1px solid #dde5ed;background:#f7fafc;padding:13px 15px;border-radius:8px;font-size:calc(13px * var(--font-scale))}
.vision-result .btn{margin:5px 6px 0 0}
.chat-layout{display:grid;grid-template-columns:260px 1fr;gap:17px;margin-top:20px;align-items:start}
.chat-threads{display:grid;gap:7px}
.chat-threads button{background:white;border:1px solid var(--line);border-radius:7px;text-align:left;padding:13px 15px;cursor:pointer}
.chat-threads button.active{border-color:var(--blue);background:#edf5fb}
.chat-messages{display:grid;gap:12px;min-height:240px;align-content:end;padding:20px;background:#f7f9fb;border-radius:8px}
.chat-bubble{max-width:85%;padding:10px 13px;border:1px solid #d9e0e7;border-radius:11px;background:white;white-space:pre-wrap;overflow-wrap:anywhere}
.chat-bubble.mine{justify-self:end;background:#e5eff9;border-color:#cedfed}
.chat-bubble .fine{margin-top:4px;text-align:right}
.chat-send{display:flex;gap:10px;margin-top:13px}
.chat-send input{flex:1}
.back-strip{padding-top:14px}
@media(max-width:720px){.chat-layout{grid-template-columns:1fr}.chat-send{flex-direction:column}}

/* Real AI photo analysis: compact configuration and clear fail-closed states */
.ai-setup{border:1px solid #d9e2ec;background:#f8fafc;border-radius:10px;padding:13px 15px;margin:12px 0}
.ai-setup summary{cursor:pointer;font-weight:700;color:var(--blue)}
.ai-setup .ai-inner{margin-top:12px}
.ai-keyrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:8px}
.ai-keyrow input{flex:1;min-width:180px}
.ai-status{margin-top:9px;padding:10px 12px;border-radius:8px;border:1px solid #d4e1ed;font-size:calc(13px * var(--font-scale));background:white}
.ai-status.error{border-color:#c84b4b;background:#fff1f1;color:#8a2222}
.ai-status.ok{border-color:#8fb3a0;background:#f1faf5;color:#185d3a}
.ai-photo-note{font-size:calc(13px * var(--font-scale));color:#5c6471;margin-top:8px}
@media(max-width:640px){.ai-keyrow{display:block}.ai-keyrow input{width:100%;margin-bottom:8px}}

/* RE:HOME 介面模式微調：買家淡藍、賣家淡奶黃、平台對話白色 */
body.mode-buyer{--role-wash:#eff7ff;--role-soft:#e5f1ff;--role-edge:#d6e8f9;background:#f4f9fe}
body.mode-seller{--role-wash:#fff9e5;--role-soft:#fff1c9;--role-edge:#f3e5bd;background:#fffcf5}
body.mode-official{--role-wash:#fff;--role-soft:#fff;--role-edge:#e4e8ed;background:#fff}
.mode-buyer .hero-banner{background:linear-gradient(115deg,#e8f4ff 0%,#f6fbff 68%)!important;border-color:#d5e7f7}
.mode-seller .hero-banner{background:linear-gradient(115deg,#fff1c5 0%,#fffaf0 68%)!important;border-color:#f2dfaf}
.mode-buyer .quicktile{background:#ecf6ff;border-color:#d9e8f7}
.mode-seller .quicktile{background:#fff7df;border-color:#f2e3bd}
.mode-buyer .rolepill{background:#e0efff;color:#00508f}
.mode-seller .rolepill{background:#fff0ba;color:#785000}
.mode-official .rolepill{background:#f1f3f6;color:#526172}
.mode-buyer .page-title,.mode-seller .page-title{border-bottom:1px solid var(--role-edge);margin-bottom:14px}
.mode-buyer .page-title .eyebrow{color:#286aa1}
.mode-seller .page-title .eyebrow{color:#9d731a}
.mode-buyer .chat-messages{background:#eef7ff}
.mode-seller .chat-messages{background:#fff8e7}
.mode-official .chat-messages{background:#fff;border:1px solid #e4e7eb}
.mode-official .chat-bubble.mine{background:#f4f6f8;border-color:#e0e5ea}
.mode-official .chat-threads button.active{background:#fff;border-color:#bac6d2}
.chat-channel{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.chat-channel button{border:1px solid #d9e0e7;border-radius:8px;padding:9px 14px;background:white;font-weight:750;color:#4f6072}
.chat-channel button.active{border-color:#0058a3;background:#eaf3fc;color:#0058a3}
.mode-official .chat-channel button.active{background:white;border-color:#7890a6;color:#31516e}
.mode-official .page-title{background:#fff}

/* Clean, universally available previous-step navigation */
.back-strip{display:flex;align-items:center;justify-content:flex-start;padding-top:16px;padding-bottom:1px}
.step-back{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;background:#fff;border:1px solid #dbe1e8;border-radius:8px;color:#0058a3;font-weight:800;font-size:calc(12px * var(--font-scale));box-shadow:0 2px 6px #001d3606}
.step-back:hover{border-color:#0058a3;background:#f7fbff}
.back-bottom{margin:26px 0 0;padding-top:12px;border-top:1px solid #e7ebef}
.tiny-demo{font-size:calc(10.5px * var(--font-scale));line-height:1.6;color:#84909a;margin:13px 0 0}
.ai-demo-price{font-size:calc(29px * var(--font-scale));font-weight:900;color:#0058a3;line-height:1.55;margin:6px 0 8px}
.ai-demo-caption{font-size:calc(12px * var(--font-scale));color:#607181}
.ai-demo-callout{border:1px solid #e3e7ee;border-radius:8px;padding:13px 15px;margin-top:13px;background:#f7fafd}
.modal .modalback{margin-top:17px;display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border:1px solid #dce2e9;border-radius:7px;background:#fff;color:#0058a3;font-size:calc(12px * var(--font-scale));font-weight:800}
@media(max-width:720px){.back-strip{padding-top:10px}.ai-demo-price{font-size:calc(25px * var(--font-scale))}}

/* 家具狀況複選：群組分明、視覺留白、手機自適應 */
.furniture-condition .issue-group{margin-top:13px}
.furniture-condition .issue-group-title{display:block;color:#627386;font-size:calc(12px * var(--font-scale));font-weight:800;margin:0 0 7px}
.furniture-condition .issue-none{margin-top:7px}
.furniture-condition .issuechoices{display:flex;gap:8px;flex-wrap:wrap}
.furniture-condition .issue-none button{border:1px solid #d6dbe1;background:#fff;padding:8px 11px;border-radius:6px;font-size:calc(12px * var(--font-scale))}
.furniture-condition .issuechoices button.active,.furniture-condition .issue-none button.active{background:#e5f0fa;border-color:var(--blue);color:var(--blue);font-weight:900}
.furniture-condition .issuechoices button.active::before,.furniture-condition .issue-none button.active::before{content:'✓ ';font-weight:900}
.furniture-condition .issue-other{margin-top:10px}
.furniture-condition .condition-hint{margin:9px 0 0}
</style>
</head>

// 家具狀況：依實際使用情境分組，支援複選、取消與其他說明。
// 僅供提案原型依賣家填寫資料示範分流，不代表 AI 已辨識照片。
const ISSUE_OPTIONS={
 none:'無明顯瑕疵',
 scratch:'輕微刮痕',
 stain:'污漬／泛黃',
 paint:'明顯刮傷／掉漆',
 peeling:'貼皮翹起／表面破損',
 parts:'缺少螺絲／配件',
 function:'抽屜／門片功能異常',
 unstable:'結構搖晃／變形',
 mold:'發霉／受潮／明顯異味',
 other:'其他'
};
const ISSUE_GROUPS=[
 ['外觀狀況',['scratch','stain','paint','peeling']],
 ['零件與功能',['parts','function']],
 ['安全與衛生',['unstable','mold']]
];
function issueGrade(items=[]){
 if(items.some(v=>['unstable','mold'].includes(v)))return 'D';
 if(items.some(v=>['peeling','parts','function'].includes(v)))return 'C';
 if(items.some(v=>['scratch','stain','paint'].includes(v)))return 'B';
 return 'A';
}
function issueText(items=[],other=''){
 const result=items.filter(v=>v!=='none'&&v!=='other').map(v=>ISSUE_OPTIONS[v]).filter(Boolean);
 if(items.includes('other'))result.push('其他：'+String(other||'').trim());
 return result.join('、')||'無明顯瑕疵';
}
function issueButton(value,items){
 const active=items.includes(value);
 return `<button type="button" class="${active?'active':''}" aria-pressed="${active}" data-act="issueToggle" data-value="${value}">${ISSUE_OPTIONS[value]}</button>`;
}

 if(kind==='C')state.draft={name:'MALM 三抽櫃',model:'MALM',type:'收納',original:2990,years:4,grade:'C',issues:['function'],issueOther:'',city:'臺中市',area:'北屯區',img:IMAGES.malm};
 if(kind==='D')state.draft={name:'LACK 邊桌',model:'LACK',type:'桌椅',original:699,years:5,grade:'D',issues:['unstable'],issueOther:'',city:'臺中市',area:'西區',img:IMAGES.table};

 render();showToast(`已載入 ${kind} 級家具示範，可點擊『開始 AI 智慧健檢與估價』體驗`);

function calcDemoPrice(){
 const f=state.draft;
 const original=Number(f.original),years=Number(f.years);
 if(!['A','B'].includes(f.grade)){state.demoPrice=null;render();showToast('請先在「賣家自行評級」選 A 或 B。C／D 級需維修或安全評估後再販售。');return;}
 if(!Number.isFinite(original)||original<=0||!Number.isFinite(years)||years<0||years>30){state.demoPrice=null;render();showToast('請輸入有效的原價及使用年限');return;}
 const ratio=f.grade==='A'?.70:.50;
 const base=original*ratio*Math.pow(.94,years);
 state.demoPrice={lo:Math.max(0,Math.round(base*.85/50)*50),hi:Math.max(0,Math.round(base*1.25/50)*50),assumedGrade:f.grade};
 state.analysis=null;render();showToast('已完成自填資料試算；沒有辨識照片，不代表家具通過審核');
}
function calcAnalysis(){
  const f=state.draft;
  const original=Number(f.original), years=Number(f.years);
  if(!f.img){showToast('請先上傳家具照片，或使用下方的家具示範案例');return;}
  if(!String(f.name||'').trim()||!String(f.model||'').trim()){
    showToast('請填寫家具名稱與 IKEA 系列');return;
  }
  if(!['A','B','C','D'].includes(f.grade)){
    showToast('請先選擇賣家自行評級');return;
  }
  const items=Array.isArray(f.issues)?f.issues:[];
  if(!items.length){showToast('請先選擇至少一項家具狀況');return;}
  if(items.includes('other')&&!String(f.issueOther||'').trim()){showToast('已選擇「其他」，請補充家具狀況');return;}
  if(items.includes('none')&&items.length>1){showToast('「無明顯瑕疵」不可與其他狀況同時選擇');return;}
  if(!Number.isFinite(original)||original<=0||!Number.isFinite(years)||years<0||years>30){
    showToast('請填寫正確的購買價格與使用年數');return;
  }
  // Proposal visualization only: grade derived from user-entered condition,
  // NOT from uploaded image. Preserve conservative self-reported safety signals.
  const conditionGrade=items.every(v=>v==='other')?f.grade:issueGrade(items);
  const grade='ABCD'[Math.max('ABCD'.indexOf(conditionGrade),'ABCD'.indexOf(f.grade))];
  const ratio=({A:.70,B:.50,C:.25,D:.05})[grade];
  const base=original*ratio*Math.pow(.94,years);
  const lo=Math.max(0,Math.round(base*.85/50)*50);
  const hi=Math.max(lo,Math.round(base*1.25/50)*50);
  state.analysis={grade,photoGrade:null,lo,hi,diff:grade!==f.grade,basis:'proposal-mock',conditionGrade,needsReview:items.includes('other'),issueSummary:issueText(items,f.issueOther)};
  state.demoPrice=null;
  render();
  showToast('示範評估完成，可查看評級及建議售價');
}
const IKEA_FAMILIES={

        <div class="back-bottom"><button class="step-back" type="button" data-act="goBack">← 上一步</button></div>
      </div>
      <div class="card seller-result"><div class="between"><h3 style="margin:0">02 · 評估結果</h3><span class="tag gold">AI 智慧評估示範</span></div>${mainResult}</div>
    </div>
  </div>`;
}
function services(){return `<div class="wrap"><div class="page-title"><span class="eyebrow">CIRCULAR SERVICES</span><h1>家具循環服務中心</h1><p class="sub">讓家具有更多選擇。是否維修、回購或回收，都由使用者自主決定。</p></div><div class="service-grid"><div class="card service"><span class="service-ic">${ic('wrench',27)}</span><h3>維修評估與小額優惠</h3><p>C 級家具可先申請維修資格評估，了解可修項目與報價；符合資格可獲試辦優惠。維修後重新評級。</p>${btn('申請維修評估','repair','outline sm')}</div><div class="card service"><span class="service-ic">${ic('refresh',27)}</span><h3>IKEA 官方回購評估</h3><p>先線上預審、再預約門市送件與實體驗收。IKEA 依轉售價值決定是否買斷，核准後以購物金給付。</p>${btn('申請官方回購','buyback','outline sm')}</div><div class="card service"><span class="service-ic">${ic('recycle',27)}</span><h3>合作回收業者媒合</h3><p>安全性不符或已無法繼續使用的家具，媒合自費清運服務。符合資格並經回收驗證後可獲循環回饋。</p>${btn('申請回收媒合','recycle','outline sm')}</div><div class="card service"><span class="service-ic">${ic('truck',27)}</span><h3>付費物流合作優惠</h3><p>一般 C2C 交易可選擇免費自行搬運，或使用合作業者的優惠報價。實際搬運及費用由業者確認。</p>${btn('了解合作物流','logistics','outline sm')}</div></div><div class="notice" style="margin-top:20px">此處的 IKEA 維修擴充、官方回購、合作清運與優惠為競賽提案流程，不代表 IKEA 台灣現已提供所有服務。</div></div>`}
function caseRow(c){const arr=STAGES[c.type];return `<button class="case-row ${state.selectedCase===c.id?'active':''}" data-act="selectCase" data-id="${e(c.id)}"><div class="between"><span class="tag ${c.step===arr.length-1?'green':'grey'}">${TYPE_LABEL[c.type]}</span><span class="fine">${e(c.id)}</span></div><h3>${e(c.title)}</h3><div class="between"><span class="sub" style="font-size:12px">${c.step===arr.length-1?'已完成':arr[c.step]}</span><span class="fine">${c.step+1}／${arr.length}</span></div><div class="progressline" style="margin-top:9px"><div style="width:${(c.step+1)/arr.length*100}%"></div></div></button>`}
function caseDetail(c){if(!c)return `<div class="card empty"><b>點選左側案件</b>查看每個階段及下一步操作。</div>`;const arr=STAGES[c.type],done=c.step>=arr.length-1;return `<div class="card case-detail"><div class="between"><span class="tag ${done?'green':'gold'}">${done?'流程完成':'進行中 · 示範'}</span><span class="fine">${e(c.id)}</span></div><h2 style="margin:13px 0 3px">${e(c.title)}</h2><p class="sub">${TYPE_LABEL[c.type]} · ${e(c.date||'示範日期')}</p><div class="progressline" style="height:7px"><div style="width:${(c.step+1)/arr.length*100}%"></div></div><div class="between" style="margin-top:9px"><b style="font-size:13px">目前：${e(arr[c.step])}</b><span class="fine">進度 ${Math.round((c.step+1)/arr.length*100)}%</span></div><div class="timelines">${arr.map((v,i)=>`<div class="timeline ${i<c.step?'done':i===c.step?'current':''}"><span class="dot">${i<c.step?'✓':i===c.step?'●':''}</span><div class="stepinfo"><b>${e(v)}</b><p>${i<c.step?'已完成（示範）':i===c.step?'目前進行階段':'尚未開始'}</p></div></div>`).join('')}</div>${c.type==='trade'?`<div class="review"><div class="strong">交易金額：${money(c.amount||0)}</div><div class="fine" style="margin-top:3px">完成後，賣家可選現金（扣 5%）或購物金（加碼 10%，設上限）。</div>${c.step>=4?`<div class="formgroup" style="margin:12px 0 3px"><label>示範賣家收益選擇</label><select id="payout"><option value="voucher" ${c.payout!=='cash'?'selected':''}>IKEA 購物金（10% 加碼）</option><option value="cash" ${c.payout==='cash'?'selected':''}>提領現金（扣除 5%）</option></select></div><b style="font-size:17px">${c.payout==='cash'?money(Math.round(c.amount*.95))+' 現金':money(c.amount+Math.min(Math.round(c.amount*.1),200))+' 購物金'}</b><div class="fine">示範加碼上限 NT$200，正式金額待定；買家綠色點數另計。</div>`:''}</div>`:''}${c.type==='buyback'?`<div class="info" style="margin-top:14px">官方買斷須經實物驗收與雙方同意；沒有保證每件家具都會收購。核准後以購物金支付。</div>`:''}<div style="margin-top:18px">${done?`<div class="notice">此案件的示範流程已完成，沒有實際付款或服務發生。</div>`:btn(`${ic('arrow',16)} 模擬進入下一階段`,'nextCase','bluebtn block',`data-id="${e(c.id)}"`)}</div><div class="fine" style="margin-top:11px">這是供評審體驗的案件狀態模擬，並未與 IKEA 或金流後台連線。</div></div>`}
function cases(){const arr=myCases();let c=arr.find(x=>x.id===state.selectedCase)||arr[0];if(c)state.selectedCase=c.id;return `<div class="wrap"><div class="page-title"><span class="eyebrow">MY REQUESTS & ORDERS</span><h1>我的案件進度</h1><p class="sub">集中查看二手交易、家具刊登、維修、官方回購與回收申請。每一步都有清楚的狀態。</p></div><div class="case-layout"><div><div class="between" style="margin-bottom:13px"><h3 style="margin:0">案件列表</h3><span class="tag grey">${arr.length} 件案件</span></div><div class="caselist">${arr.length?arr.map(caseRow).join(''):`<div class="card empty">尚無案件。先探索家具或提交申請吧。</div>`}</div><div class="fine" style="margin-top:12px">示範案件以 RH-DEMO 開頭；你的操作會產生新的模擬案件。</div></div>${caseDetail(c)}</div></div>`}
function openModal(type){let h='',body='';if(type==='offer'){const p=state.products.find(x=>x.id===state.selectedProduct)||state.products[0];h='提出議價與預約驗貨';body=`<p class="sub">對 ${e(p.name)} 提出出價，平台會建立一筆可追蹤的模擬交易案件。</p><div class="formgroup"><label>希望成交價格（NT$）</label><input id="offer-price" type="number" min="1" value="${p.price}"></div><div class="formgroup"><label>希望驗貨日期</label><input id="visit-date" type="date"></div><div class="info">賣家同意預約後才分享必要的交接資訊。現場確認實物，再進行平台付款。</div>${btn('送出議價與驗貨申請','offerSubmit','bluebtn block','style="margin-top:18px"')}`}
else if(type==='watch'){h='設定附近家具上架通知';body=`<p class="sub">設定想找的 IKEA 型號，新商品符合條件時示範平台會通知你。</p><div class="formgroup"><label>IKEA 型號</label><select id="watch-model">${IKEA_MODEL_OPTIONS.map(x=>`<option>${e(x)}</option>`).join('')}</select></div><div class="formgroup"><label>附近範圍</label><select id="watch-area"><option>5 公里內</option><option selected>10 公里內</option><option>20 公里內</option></select></div>${btn('設定示範通知','watchSubmit','bluebtn block')}`}
else if(type==='list'){h='完成二手家具刊登';body=`<p class="sub">此處建立的是本機示範刊登，不會對外公開。</p><div class="formgroup"><label>自行設定刊登售價（NT$）</label><input type="number" min="1" id="my-price" value="${state.analysis?Math.max(100,Math.round((state.analysis.lo+state.analysis.hi)/2)):1000}"></div><div class="info">參考售價為示意，賣家仍可自主定價與議價。</div>${btn('確認示範刊登','listSubmit','bluebtn block','style="margin-top:17px"')}`}
else if(type==='appeal'){h='申請人工複核';body=`<p class="sub">如果自評與系統結果有落差，可以附上說明，申請人員重新檢查。</p><div class="formgroup"><label>申覆原因</label><textarea id="appeal-reason" rows="3" placeholder="例如：照片陰影被誤判為瑕疵，願意補充近照。"></textarea></div>${btn('提交示範複核申請','appealSubmit','bluebtn block')}`}
else if(['repair','buyback','recycle','logistics'].includes(type)){const details={repair:['提出維修評估','先確認維修資格與報價，符合資格可獲小額維修優惠；修好後重新評級。'],buyback:['申請 IKEA 官方回購','線上資格初審 → 門市收件預約 → 實體驗收與正式報價 → 雙方同意後發放購物金。'],recycle:['媒合合作回收業者','由合作業者報價、消費者自費清運；符合資格並經查證後才發放回饋。'],logistics:['合作物流優惠','依家具尺寸、樓層與距離估價，實際條件與責任由合作業者確認。']}[type];h=details[0];body=`<p class="sub">${details[1]}</p><div class="formgroup"><label>家具名稱（可選）</label><input id="service-name" placeholder="例如 MALM 抽屜櫃" value="${e(state.draft.name||'')}"></div><div class="formgroup"><label>希望聯繫方式</label><select><option>站內通知（模擬）</option></select></div><div class="notice">${type==='logistics'?'本原型僅展示合作折扣流程，並未建立真實物流預約。':'不代表 IKEA 台灣已提供本項擴充服務；本次僅建立流程示範案件。'}</div>${btn('送出示範申請','serviceSubmit','bluebtn block',`data-kind="${type}" style="margin-top:17px"`)}`}
state.modal={type};document.getElementById('modalroot').innerHTML=`<div class="overlay" data-act="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${e(h)}"><button class="x" data-act="close" aria-label="關閉視窗">×</button><h2>${h}</h2>${body}<button type="button" class="modalback" data-act="close">← 上一步</button></div></div>`}
function closeModal(){state.modal=null;document.getElementById('modalroot').innerHTML=''}
function addCase(type,title,role=state.role,amount=0){const c={id:'RH-'+Date.now().toString().slice(-8),type,title: title||TYPE_LABEL[type],role,step:0,amount,date:new Date().toLocaleDateString('zh-TW'),payout:'voucher'};state.cases.unshift(c);state.selectedCase=c.id;save();closeModal();pageGo('cases');showToast('已建立模擬案件，請查看進度追蹤');return c}
function listenFields(){document.querySelectorAll('[data-draft]').forEach(el=>{el.addEventListener('change',()=>{const key=el.dataset.draft;state.draft[key]=['original','years'].includes(key)?Number(el.value):el.value;if(key==='city'){state.draft.area=(TW_AREAS[el.value]||[])[0]||'';state.analysis=null;state.demoPrice=null;render();return;}if(key==='model'){
 const suggestion=IKEA_FAMILIES[String(state.draft.model||'').trim().toUpperCase()];
 if(suggestion){state.draft.type=suggestion;state.draft.model=String(state.draft.model).trim().toUpperCase();render();showToast('已套用常見系列的參考類別；此非 IKEA 真偽或型號認證');return;}
 }
 state.analysis=null;state.demoPrice=null})})}
function render(){document.body.classList.remove('mode-buyer','mode-seller','mode-official');document.body.classList.add(state.page==='messages'&&state.chatChannel==='official'?'mode-official':state.role==='seller'?'mode-seller':state.role==='buyer'?'mode-buyer':'mode-official');topNav();const page=state.page==='entry'?entry():state.page==='buyerHome'?buyerHome():state.page==='sellerHome'?sellerHome():state.page==='browse'?browse():state.page==='detail'?details():state.page==='sell'?sellerForm():state.page==='services'?services():state.page==='messages'?messages():cases();const back=state.role&&state.page!=='entry'?'<div class="wrap back-strip"><button type="button" class="step-back" data-act="goBack">← 上一步</button></div>':'';document.getElementById('app').innerHTML=back+page;listenFields()}
function handleAction(el,event){const action=el.dataset.act,id=el.dataset.id;if(!action)return;const navPages=['buyerHome','sellerHome','browse','sell','services','cases','detail','messages'];if(navPages.includes(action)){pageGo(action);return}
switch(action){case 'fontSize':{const size=el.dataset.size;if(!['small','medium','large'].includes(size))break;state.fontSize=size;try{localStorage.setItem('rehome_v2_font',size)}catch{}topNav();break}case 'goBack':{const previous=state.history.pop()||((state.page==='buyerHome'||state.page==='sellerHome')?'entry':(state.role==='buyer'?'buyerHome':'sellerHome'));state.page=previous;if(previous==='entry')state.role=null;state.modal=null;render();window.scrollTo({top:0,behavior:'instant'});break}case 'chatPeer':state.chatChannel='peer';render();break;case 'chatOfficial':state.chatChannel='official';render();break;case 'openChat':state.chatChannel='peer';state.history.push(state.page);state.page='messages';render();window.scrollTo({top:0,behavior:'instant'});break;case 'chatSelect':state.selectedProduct=Number(id);render();break;case 'recognizeType':recognizeFurniture('type');break;case 'demoEstimate':calcDemoPrice();break;case 'recognizeLabel':recognizeFurniture('label');break;case 'applyVision':{const model=el.dataset.value;if(!IKEA_FAMILIES[model])break;state.draft.model=model;state.draft.type=IKEA_FAMILIES[model];state.draft.name=model+' 二手家具';state.analysis=null;state.vision=null;render();showToast('已帶入候選型號，請確認家具名稱與原價');break}case 'nav':pageGo(el.dataset.page);break;case 'entry':case 'switch':state.history=[];state.role=null;pageGo('entry');break;case 'buyer':setRole('buyer');break;case 'seller':setRole('seller');break;case 'menu':state.mobile=!state.mobile;topNav();break;case 'casesEntry':showToast('請先選擇買家或賣家身分，再從「案件進度」查看對應案件。');break;case 'product':state.selectedProduct=Number(id);pageGo('detail');break;case 'heart':{event.stopPropagation();const pid=Number(id||state.selectedProduct);state.favs=state.favs.includes(pid)?state.favs.filter(x=>x!==pid):[...state.favs,pid];save();render();showToast(state.favs.includes(pid)?'已加入收藏':'已取消收藏');break}
case 'mapPin':state.selectedProduct=Number(id);render();break;case 'clear':state.filters={query:'',type:'all',grade:'all',max:'all'};render();break;case 'watch':case 'offer':case 'list':case 'appeal':case 'repair':case 'buyback':case 'recycle':case 'logistics':openModal(action);break;case 'issueToggle':{
 const value=el.dataset.value;
 let items=Array.isArray(state.draft.issues)?[...state.draft.issues]:[];
 if(items.includes(value)){
   items=items.filter(x=>x!==value);
   if(value==='other')state.draft.issueOther='';
 }else if(value==='none'){
   items=['none'];state.draft.issueOther='';
 }else{
   items=items.filter(x=>x!=='none');items.push(value);
 }
 state.draft.issues=items;
 state.analysis=null;state.demoPrice=null;
 render();break;
}case 'sample':previewData(el.dataset.kind);break;case 'analyze':calcAnalysis();break;case 'selectCase':state.selectedCase=id;render();break;case 'nextCase':{const c=state.cases.find(c=>c.id===id);if(c){c.step=Math.min(STAGES[c.type].length-1,c.step+1);save();render();showToast(`進度已更新：${STAGES[c.type][c.step]}（示範）`)}break}
case 'close':closeModal();break;case 'backdrop':if(event.target===el)closeModal();break;case 'offerSubmit':{const p=state.products.find(p=>p.id===state.selectedProduct);const amt=Number(document.getElementById('offer-price')?.value);if(!amt||amt<=0){showToast('請先輸入有效的議價金額');return}addCase('trade',p.name,'both',amt);break}
case 'listSubmit':{const f=state.draft,a=state.analysis,price=Number(document.getElementById('my-price')?.value);if(!a||!['A','B'].includes(a.grade)){showToast('請先完成符合條件的家具評估');return}if(!Number.isFinite(price)||price<=0){showToast('請輸入有效的刊登價格');return}const p={id:Date.now(),name:f.name||f.model+' 二手家具',model:f.model,type:f.type,price,original:Number(f.original),years:Number(f.years),grade:a.grade,city:f.city||'臺中市',area:f.area,landmark:(f.city||'臺中市')+f.area+'附近地標',px:53,py:53,condition:issueText(f.issues||[],f.issueOther),size:'請與賣家確認',pick:'自行取貨或付費合作物流',img:f.model==='MALM'?'malm':f.model==='KIVIK'?'sofa':f.model==='LISABO'?'table':'shelf',customImg:f.img||''};state.products.unshift(p);save();addCase('listing',p.name,'seller');break}
case 'appealSubmit':{if(!document.getElementById('appeal-reason')?.value.trim()){showToast('請填寫申覆原因');return}addCase('appeal',state.draft.name||state.draft.model+' 家具評級','seller');break}
case 'serviceSubmit':{const type=el.dataset.kind;const item=document.getElementById('service-name')?.value.trim()||state.draft.name||'IKEA 家具';if(type==='logistics'){closeModal();showToast('已記錄示範物流詢問；實際報價需合作業者確認');return}addCase(type,item,state.role);break}
case 'watchSubmit':{const model=document.getElementById('watch-model').value,area=document.getElementById('watch-area').value;state.watches.push({model,area});save();closeModal();showToast(`已設定 ${model} · ${area} 的模擬上架提醒`);break}
}}
document.addEventListener('click',evt=>{const el=evt.target.closest('[data-act]');if(el)handleAction(el,evt)});
document.addEventListener('keydown',evt=>{if(evt.key==='Escape')closeModal();if(evt.key==='Enter'&&evt.target.matches('.product[role="button"]')){state.selectedProduct=Number(evt.target.dataset.id);pageGo('detail')}});
document.addEventListener('change',evt=>{const el=evt.target;if(['type','grade','max'].includes(el.id)){state.filters[el.id]=el.value;render()}if(el.id==='payout'){const c=state.cases.find(c=>c.id===state.selectedCase);if(c){c.payout=el.value;save();render()}}if(el.id==='photo'&&el.files&&el.files[0]){const file=el.files[0];if(file.size>9*1024*1024){showToast('請選擇小於 9MB 的照片');return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,900/Math.max(img.width,img.height)),can=document.createElement('canvas');can.width=Math.round(img.width*s);can.height=Math.round(img.height*s);can.getContext('2d').drawImage(img,0,0,can.width,can.height);state.draft.img=can.toDataURL('image/jpeg',.68);state.analysis=null;state.demoPrice=null;state.vision=null;state.labelVision=null;state.demoMode=false;state.visionRunId++;state.visionBusy=false;render();showToast('照片已上傳，可進行示範評級與估價')};img.src=reader.result};reader.readAsDataURL(file)}});
document.addEventListener('submit',evt=>{if(evt.target.id==='officialChatForm'){evt.preventDefault();const text=document.getElementById('officialChatText')?.value.trim();if(text){state.officialDrafts.push(text.slice(0,500));render();showToast('已記錄在本機展示頁，未送至 IKEA 官方');}return;}if(evt.target.id!=='chatForm')return;evt.preventDefault();const el=document.getElementById('chatText'),text=el?.value.trim();if(!text||!state.role||!state.selectedProduct)return;const k=String(state.selectedProduct);if(!Array.isArray(state.messages[k]))state.messages[k]=[];state.messages[k].push({from:state.role,text:text.slice(0,500),time:new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})});save();render();showToast('已加入本機示範對話')});
document.addEventListener('input',evt=>{if(evt.target.id==='q'){const position=evt.target.selectionStart;state.filters.query=evt.target.value;render();const el=document.getElementById('q');if(el){el.focus();el.setSelectionRange(position,position)}}});
render();
</script>
</body>
